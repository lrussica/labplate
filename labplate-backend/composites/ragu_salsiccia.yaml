composite: ragu_salsiccia
version: 1
displayName: "Ragù di Salsiccia"
category: pasta_sauce
aliases: ["ragu salsiccia", "salsiccia ragu", "wurst ragout"]

core:
  sausage:
    roles: [protein, base, fat]
    allowed: [sausage, italian_sausage]
    amount_g: [62, 125]
  soffritto_onion:
    roles: [aromatic]
    allowed: [onion, onion_yellow, shallot]
    amount_g: [10, 25]
  wine:
    roles: [acid, liquid]
    allowed: [red_wine, white_wine]
    amount_g: [20, 50]
  tomato_passata:
    roles: [base]
    allowed: [tomato_passata, tomato_canned, tomato_puree]
    amount_g: [75, 150]
  stock:
    roles: [liquid]
    allowed: [vegetable_broth, beef_broth, water]
    amount_g: [50, 100]
  seasoning:
    roles: [seasoning]
    cardinality: one_or_more
    allowed: [salt, black_pepper]
    amount_g: [0.2, 1.5]

tolerated:
  soffritto_carrot:
    roles: [aromatic, sweet]
    allowed: [carrot]
    amount_g: [0, 20]
  soffritto_celery:
    roles: [aromatic]
    allowed: [celery]
    amount_g: [0, 15]
  olive_oil:
    roles: [technique]
    allowed: [olive_oil]
    amount_g: [0, 5]
  whole_milk:
    roles: [finishing_technique]
    allowed: [whole_milk, milk_whole]
    amount_g: [0, 20]
  parmesan:
    roles: [finish, umami]
    allowed: [parmesan, parmigiano_reggiano, pecorino]
    amount_g: [0, 10]

forbidden:
  - beef_mince
  - pancetta
  - guanciale
  - cream_heavy
  - garlic
  - oregano

ratios:
  sausage_to_tomato: [0.4, 1.0]

technique:
  - step: remove_sausage_casing
  - step: prepare_soffritto
  - step: brown_sausage
  - step: add_soffritto
  - step: deglaze_with_wine
  - step: add_tomato_and_stock
  - step: simmer_long
    params: { duration_min: [60, 120] }

notes:
  - "Eigenstaendiges Ragù-Profil, keine Bolognese-Variante."
  - "Salsiccia bringt eigenes Fett und Wuerzung."
