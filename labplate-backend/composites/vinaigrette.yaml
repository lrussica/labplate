composite: vinaigrette
version: 1
displayName: "Vinaigrette"
category: salad_dressing
aliases: ["vinaigrette", "franzoesische vinaigrette", "oil vinegar"]

core:
  olive_oil:
    roles: [fat, base]
    allowed: [olive_oil]
    amount_g: [60, 120]
  red_wine_vinegar:
    roles: [acid]
    allowed: [red_wine_vinegar, vinegar]
    amount_g: [15, 45]
  dijon_mustard:
    roles: [emulsifier]
    allowed: [dijon_mustard, mustard]
    amount_g: [5, 15]
  salt:
    roles: [seasoning]
    allowed: [salt]
    amount_g: [1, 4]
  black_pepper:
    roles: [seasoning]
    allowed: [black_pepper, pepper]
    amount_g: [0, 3]

tolerated:
  white_wine_vinegar:
    roles: [acid]
    allowed: [white_wine_vinegar]
    amount_g: [0, 45]
    notes: "Hellere, mildere Variante statt Rotweinessig."
  shallot:
    roles: [aromatic]
    allowed: [shallot, onion_yellow]
    amount_g: [0, 20]
  fresh_herbs:
    roles: [finish]
    allowed: [parsley, chives, chive, tarragon, basil]
    amount_g: [0, 10]
  honey:
    roles: [sweet]
    allowed: [honey]
    amount_g: [0, 10]

forbidden:
  - cream_heavy
  - yogurt
  - milk_whole
  - mayonnaise

ratios:
  oil_to_vinegar: [2.0, 4.0]  # Klassisch 3:1, Toleranzband 2:1 bis 4:1

technique:
  - step: dissolve_salt_in_vinegar
  - step: add_mustard
  - step: whisk_oil_slowly
  - step: season_pepper
  - step: add_herbs_optional

notes:
  - "Klassische franzoesische Grundformel: 3 Teile Öl zu 1 Teil Essig."
  - "Senf ist Emulgator (R9)."
  - "Rotweinessig ist Referenz, Weissweinessig tolerated."
