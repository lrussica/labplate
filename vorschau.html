<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vorschau: Rezept-Coach Pills</title>
<style>
  body {
    background-color: #000000;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding-top: 50px;
  }
  .phone-mockup {
    width: 100%;
    max-width: 400px;
    padding: 20px;
  }
  .header {
    text-align: center;
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 30px;
    letter-spacing: -0.5px;
  }
  .search-bar {
    background-color: #1c1c1e;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    margin-bottom: 16px;
  }
  .search-icon {
    color: #8b5cf6;
    margin-right: 12px;
    font-size: 20px;
  }
  .search-text {
    color: #888;
    font-size: 16px;
    flex: 1;
  }
  .send-btn {
    background:#8b5cf6;
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color: #fff;
    font-size: 16px;
  }
  .pill {
    background-color: #1c1c1e;
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }
  .pill-icon {
    margin-right: 16px;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
  }
  .pill-text {
    font-size: 16px;
    font-weight: 500;
    flex: 1;
    color: #fff;
  }
  .pill-chevron {
    color: #8b5cf6;
    font-size: 20px;
    font-weight: 400;
  }
</style>
</head>
<body>
  <div class="phone-mockup">
    <div class="header">Rezept-Coach</div>
    
    <!-- Suchleiste -->
    <div class="search-bar">
      <div class="search-icon">🔍</div>
      <div class="search-text">Rezept oder Zutaten eingeben</div>
      <div class="send-btn">➤</div>
    </div>

    <!-- Bestehende Pills -->
    <div class="pill">
      <div class="pill-icon">⚡</div>
      <div class="pill-text">Schnelles High-Protein Gericht</div>
      <div class="pill-chevron">›</div>
    </div>
    <div class="pill">
      <div class="pill-icon">🥑</div>
      <div class="pill-text">Low-Carb / Keto Idee</div>
      <div class="pill-chevron">›</div>
    </div>
    <div class="pill">
      <div class="pill-icon">🍓</div>
      <div class="pill-text">Süßer Snack unter 200 kcal</div>
      <div class="pill-chevron">›</div>
    </div>

    <!-- NEUE PILL: Rezepte entdecken (mit Buch-Emoji) -->
    <div class="pill">
      <div class="pill-icon">📖</div>
      <div class="pill-text">Rezepte entdecken</div>
      <div class="pill-chevron">›</div>
    </div>
    
  </div>
</body>
</html>
