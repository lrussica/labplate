<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vorschau: Rezepte entdecken V2</title>
<style>
  :root {
    --bg: #000000; --sheet-bg: #0a0a0a; --card-bg: #1c1c1e;
    --purple: #8b5cf6; --text: #ffffff; --text-muted: #8e8e93;
  }
  body {
    background-color: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden;
  }
  .sheet {
    background-color: var(--sheet-bg); width: 100%; max-width: 500px;
    height: 95vh; border-radius: 24px 24px 0 0; align-self: flex-end;
    display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
  }
  .drag-handle {
    width: 40px; height: 5px; background: #3a3a3c; border-radius: 10px;
    margin: 12px auto 20px auto;
  }
  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0 20px; margin-bottom: 20px;
  }
  .header h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
  .header .count { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
  .close-btn {
    background: #1c1c1e; border: none; color: var(--text-muted);
    width: 32px; height: 32px; border-radius: 50%; font-size: 16px;
    display: flex; justify-content: center; align-items: center; cursor: pointer;
  }
  .search-container { padding: 0 20px; margin-bottom: 16px; }
  .search-bar {
    background: var(--card-bg); border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.05);
  }
  .search-bar input {
    background: transparent; border: none; color: var(--text); font-size: 16px;
    flex: 1; outline: none;
  }
  .search-bar input::placeholder { color: var(--text-muted); }
  
  .tabs-container {
    display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 16px 20px;
    scrollbar-width: none;
  }
  .tabs-container::-webkit-scrollbar { display: none; }
  .tab {
    background: var(--card-bg); color: var(--text); border-radius: 20px;
    padding: 8px 16px; font-size: 15px; font-weight: 500; white-space: nowrap;
    cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
  }
  .tab.active { background: var(--purple); border-color: var(--purple); }

  .list-header { padding: 0 20px 10px 20px; color: var(--text-muted); font-size: 14px; }
  .list { flex: 1; overflow-y: auto; padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: 8px; }
  
  .recipe-card {
    display: flex; align-items: center; gap: 16px; padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
  }
  .recipe-img {
    width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle, #d9a05b 0%, #8b5a2b 60%, #5a3a1b 100%);
    flex-shrink: 0;
  }
  .recipe-info { flex: 1; }
  .recipe-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .recipe-meta { color: var(--text-muted); font-size: 14px; }
  .recipe-chevron { color: var(--text-muted); font-size: 18px; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="drag-handle"></div>
    
    <div class="header">
      <div>
        <h1>Rezepte entdecken</h1>
        <div class="count">400 Rezepte</div>
      </div>
      <button class="close-btn">✕</button>
    </div>

    <div class="search-container">
      <div class="search-bar">
        <span style="color: var(--text-muted);">🔍</span>
        <input type="text" placeholder="Rezept oder Zutat suchen">
      </div>
    </div>

    <div class="tabs-container">
      <div class="tab active">Alle</div>
      <div class="tab">Frühstück</div>
      <div class="tab">Hauptgang</div>
      <div class="tab">Leichtes Abendessen</div>
      <div class="tab">Nachspeise</div>
      <div class="tab">Vorspeise</div>
    </div>

    <div class="list-header">400 Treffer</div>

    <div class="list">
      <div class="recipe-card">
        <div class="recipe-img"></div>
        <div class="recipe-info">
          <div class="recipe-title">Shakshuka mit weißen Bohnen</div>
          <div class="recipe-meta">25 Min · 420 kcal / Portion</div>
        </div>
        <div class="recipe-chevron">›</div>
      </div>
      <div class="recipe-card">
        <div class="recipe-img"></div>
        <div class="recipe-info">
          <div class="recipe-title">Lachs vom Blech mit Brokkoli</div>
          <div class="recipe-meta">30 Min · 510 kcal / Portion</div>
        </div>
        <div class="recipe-chevron">›</div>
      </div>
      <div class="recipe-card">
        <div class="recipe-img"></div>
        <div class="recipe-info">
          <div class="recipe-title">Kichererbsen-Bowl mit Kräuterjoghurt</div>
          <div class="recipe-meta">20 Min · 460 kcal / Portion</div>
        </div>
        <div class="recipe-chevron">›</div>
      </div>
    </div>
  </div>
</body>
</html>
